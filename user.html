<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RutinasFit - Panel del Usuario</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="user-body">
  <!-- 🔹 Barra de navegación -->
  <header class="navbar">
    <div class="logo">Rutinas<span>Fit</span></div>
    <div class="menu-toggle" id="menuToggle">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <nav>
      <ul>
        <li><button class="nav-btn active" data-tab="inicio">Inicio</button></li>
        <li><button class="nav-btn" data-tab="calendario">Calendario</button></li>
        <li><button class="nav-btn" data-tab="rutina">Rutina</button></li>
        <li><button class="nav-btn" data-tab="chat">Chat</button></li>
        <li><button id="logoutBtn" class="nav-btn logout-btn">Cerrar sesión</button></li>
      </ul>
    </nav>
  </header>

  <!-- 🔹 Contenido principal -->
  <main class="page-content">
    <!-- 🏠 Inicio -->
    <section id="inicio" class="tab-content active">
      <h2>Bienvenido <span id="userName"></span> 👋</h2>
      <p>Correo: <span id="userEmail"></span></p>
      <div id="userDataContainer" class="user-data-box"></div>
    </section>

    <!-- 📅 Calendario -->
    <section id="calendario" class="tab-content">
      <h2>Calendario de rutinas</h2>
      <p>Aquí verás tu planificación semanal.</p>
      <div id="calendarContainer" class="calendar-container">
        <p>Esta sección mostrará un calendario con tus rutinas diarias.</p>
      </div>
    </section>

    <!-- 💪 Rutina -->
    <section id="rutina" class="tab-content">
      <h2>Tu rutina personalizada</h2>
      <div id="rutinaContainer" class="rutina-box"></div>
      <button id="crearRutinaBtn" class="btn">Crear rutina personalizada</button>
    </section>

    <!-- 💬 Chat -->
    <section id="chat" class="tab-content">
      <h2>Asistente virtual 🤖</h2>
      <div id="chatBox" class="chat-box">
        <div id="chatMessages" class="chat-messages"></div>

        <div class="chat-input">
          <textarea id="chatInput" placeholder="Escribe tu duda..."></textarea>
          <button id="sendChatBtn" class="btn">Enviar</button>
        </div>
      </div>
    </section>

  </main>

  <script type="module" src="user.js"></script>
</body>

</html>
